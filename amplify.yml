version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Pre-build phase - Installing dependencies"
            - echo "Node version: $(node --version)"
            - echo "NPM version: $(npm --version)"
            - npm ci
        build:
          commands:
            - echo "Build phase - Building Vite React app"
            - npm run build
            - echo "Verifying build output..."
            - test -f dist/index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
            - test -d dist/assets && echo "✓ assets directory found" || (echo "✗ assets directory missing" && exit 1)
            - echo "Build completed successfully ✓"
        postBuild:
          commands:
            - echo "Post-build phase - Generating sitemap"
            - |
              cat > dist/sitemap.xml << 'EOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>weekly</changefreq>
                  <priority>1.0</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#about</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.8</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#skills</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.8</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#projects</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>weekly</changefreq>
                  <priority>0.9</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#achievements</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.7</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#contact</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.7</priority>
                </url>
              </urlset>
              EOF
            - echo "Sitemap generated ✓"
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: .
    # Custom headers for security and performance
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=()'
      - pattern: '**/*.html'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=0, must-revalidate'
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ${VITE_CONTACT_API_URL}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - pattern: '**/*.css'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.js'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.woff2'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.png'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.jpg'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.svg'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.ico'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: 'assets/resume.pdf'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=86400'
          - key: 'Content-Disposition'
            value: 'attachment; filename="Vaibhava_Kumar_Shrivastav_Resume.pdf"'
    # SPA rewrites - serve index.html for all routes
    customRewrites:
      - source: '/<*>'
        target: '/index.html'
        status: 200
    # Environment variables
    env:
      variables:
        NODE_ENV: 'production'
        # VITE_CONTACT_API_URL will be set in Amplify console