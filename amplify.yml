version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Pre-build phase - No build step required for static site"
            - echo "Node version: $(node --version)"
            - echo "NPM version: $(npm --version)"
        build:
          commands:
            - echo "Build phase - Static site, no compilation needed"
            - echo "Verifying files exist..."
            - test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
            - test -f css/styles.css && echo "✓ css/styles.css found" || (echo "✗ css/styles.css missing" && exit 1)
            - test -f js/main.js && echo "✓ js/main.js found" || (echo "✗ js/main.js missing" && exit 1)
            - test -f js/data.js && echo "✓ js/data.js found" || (echo "✗ js/data.js missing" && exit 1)
            - test -f js/xp.js && echo "✓ js/xp.js found" || (echo "✗ js/xp.js missing" && exit 1)
            - test -f js/terminal.js && echo "✓ js/terminal.js found" || (echo "✗ js/terminal.js missing" && exit 1)
            - test -f js/intro.js && echo "✓ js/intro.js found" || (echo "✗ js/intro.js missing" && exit 1)
            - echo "All required files verified ✓"
        postBuild:
          commands:
            - echo "Post-build phase - Optimizing assets"
            - echo "Generating sitemap..."
            - |
              cat > public/sitemap.xml << 'EOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>weekly</changefreq>
                  <priority>1.0</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#about</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.8</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#experience</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.8</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#projects</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>weekly</changefreq>
                  <priority>0.9</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#skills</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.7</priority>
                </url>
                <url>
                  <loc>https://vaibhava-shrivastav.vercel.app/#contact</loc>
                  <lastmod>$(date -u +%Y-%m-%d)</lastmod>
                  <changefreq>monthly</changefreq>
                  <priority>0.7</priority>
                </url>
              </urlset>
              EOF
            - echo "Sitemap generated ✓"
      artifacts:
        baseDirectory: .
        files:
          - '**/*'
      cache:
        paths: []
    appRoot: .
    # Custom headers for security and performance
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-XSS-Protection'
            value: '1; mode=block'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=()'
      - pattern: '**/*.html'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=0, must-revalidate'
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - pattern: '**/*.css'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.js'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.woff2'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.png'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.jpg'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.svg'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*.ico'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: 'assets/resume.pdf'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=86400'
          - key: 'Content-Disposition'
            value: 'attachment; filename="Vaibhava_Kumar_Shrivastav_Resume.pdf"'
    # Redirects for SPA-like behavior (if needed)
    customRewrites:
      - source: '/<*>'
        target: '/index.html'
        status: 200
    # Environment variables
    env:
      variables:
        NODE_ENV: 'production'